# 2 GB is comfortable for an AGP 8 build; raise it if the daemon runs out of heap.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build modules in parallel and reuse results between builds.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is mandatory for the support libraries this project uses.
android.useAndroidX=true

# Generate only the resources the app actually declares.
android.nonTransitiveRClass=true
