/*
 * =============================================================================
 * File        : app/build.gradle
 * Project     : Smart Solar Microgrid Trading System - Android Client
 * Description : Module build script for the pure native Android application.
 *
 *               ASSIGNMENT CONSTRAINT: this must be pure native Android with a
 *               local SQLite database and no cross platform framework. There is
 *               therefore no React Native, Flutter, Xamarin, Cordova or Ionic
 *               dependency anywhere below. Networking uses java.net.HttpURLConnection
 *               from the platform itself, JSON uses the org.json parser bundled
 *               with Android, and persistence uses android.database.sqlite
 *               (SQLiteOpenHelper) directly - not Room, not an ORM.
 *
 *               The only third party artefacts are:
 *                 - AndroidX / Material  : the standard Google UI libraries
 *                 - play-services-maps   : the Google Maps API required by the spec
 *                 - play-services-location: device location for "nearby nodes"
 *                 - zxing-android-embedded: the QR scanner required by the spec
 *               These are libraries, not application frameworks.
 * Author      : Smart Solar Microgrid Team - SE4040 Enterprise Application Dev
 * Created     : 2026-09-04
 * =============================================================================
 */

plugins {
    id 'com.android.application'
}

// Read the Google Maps API key from local.properties so the key never enters version control.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}
def mapsApiKey = localProperties.getProperty('MAPS_API_KEY', '')

// The API base URL is also configurable per build type so a debug build can point
// at a developer machine while a release build points at the IIS deployment.
def deployedApiBaseUrl = 'http://cdpyk21iglrjj4bdyksuuogc.62.171.163.6.sslip.io/api/v1/'
def debugApiBaseUrl = localProperties.getProperty('API_BASE_URL_DEBUG', deployedApiBaseUrl)
def releaseApiBaseUrl = localProperties.getProperty('API_BASE_URL_RELEASE', deployedApiBaseUrl)

android {
    namespace 'lk.sliit.smartsolar'
    compileSdk 35

    defaultConfig {
        applicationId "lk.sliit.smartsolar"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Injected into AndroidManifest.xml as ${MAPS_API_KEY}.
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
    }

    buildTypes {
        debug {
            minifyEnabled false
            // BuildConfig.API_BASE_URL is how the app finds the central Web API.
            buildConfigField "String", "API_BASE_URL", "\"${debugApiBaseUrl}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_BASE_URL", "\"${releaseApiBaseUrl}\""
        }
    }

    buildFeatures {
        // BuildConfig carries API_BASE_URL; view binding is deliberately NOT used so
        // the code stays explicit findViewById native Android, which is easier to
        // explain at the viva.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    lint {
        // A lint warning must not fail the build the marker runs.
        abortOnError false
    }
}

dependencies {
    // ---- AndroidX / Material : standard Google UI toolkit ----------------------
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1'

    // ---- Google Maps API (required by the specification) -----------------------
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // ---- QR code scanning and rendering (required by the specification) --------
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'

    // ---- Tests -----------------------------------------------------------------
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
